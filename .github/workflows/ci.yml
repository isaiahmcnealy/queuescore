name: CI

# Fast guard for parallel hackathon work: does the contract still hold and does
# the app still import? Runs on every push and PR. No deploy — that's manual.
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.12 has prebuilt wheels for gridstatus's lxml~=5.3 pin.
          # 3.14 forces a source build (needs libxml2/libxslt) and breaks CI.
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run contract tests
        run: pytest -q

      - name: Smoke-check the app imports
        # Catches a broken import / syntax error in app.py before the demo does.
        run: python -c "import sys; sys.path.insert(0, '.'); import src.app; print('app imports OK')"
